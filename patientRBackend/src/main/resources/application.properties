spring.application.name=patientR

# Application Configuration

server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/patient_recovery_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Darshan@1234

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Database Platform
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.bootstrap-professional.name=${PROFESSIONAL_NAME:}
app.bootstrap-professional.email=${PROFESSIONAL_EMAIL:}
app.bootstrap-professional.password=${PROFESSIONAL_PASSWORD:}
